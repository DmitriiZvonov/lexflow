const btn = document.getElementById('restore');
const statusBox = document.getElementById('status');

function setStatus(text, cls='') {
  statusBox.textContent = text;
  statusBox.className = cls;
}

async function restoreWords() {
  btn.disabled = true;
  try {
    setStatus('1/4 Проверяю локальные данные LexFlow...');

    const rawLocal = localStorage.getItem(STORAGE_KEY);
    if (!rawLocal) throw new Error('На этом устройстве не найдены локальные данные LexFlow.');

    const localDb = JSON.parse(rawLocal);
    const token = localDb?.github?.token;
    if (!token) throw new Error('На этом устройстве GitHub не подключён в LexFlow. Восстановление остановлено — ничего не изменено.');

    if (!Array.isArray(RECOVERY_WORDS) || RECOVERY_WORDS.length !== 313) {
      throw new Error('Резервная копия не прошла проверку: ожидалось 313 слов.');
    }

    setStatus('2/4 Загружаю текущий Gist и сохраняю его плейлисты...');

    const headers = {
      'Authorization': `token ${token}`,
      'Accept': 'application/vnd.github+json',
      'Content-Type': 'application/json'
    };

    const getRes = await fetch(`https://api.github.com/gists/${GIST_ID}`, { headers });
    if (!getRes.ok) throw new Error('Не удалось прочитать Gist. HTTP ' + getRes.status);

    const gist = await getRes.json();
    const file = gist?.files?.['lexflow_data.json'];
    if (!file?.content) throw new Error('В Gist не найден lexflow_data.json.');

    const currentCloud = JSON.parse(file.content);
    if (!Array.isArray(currentCloud.playlists)) {
      throw new Error('Текущие плейлисты Gist не прошли проверку. Ничего не изменено.');
    }

    const restoredCloud = {
      ...currentCloud,
      playlists: currentCloud.playlists,
      words: RECOVERY_WORDS
    };

    setStatus('3/4 Восстанавливаю только words в Gist...');

    const patchBody = JSON.stringify({
      description: gist.description || 'LexFlow vocabulary data',
      files: {
        'lexflow_data.json': {
          content: JSON.stringify(restoredCloud, null, 2)
        }
      }
    });

    const patchRes = await fetch(`https://api.github.com/gists/${GIST_ID}`, {
      method: 'PATCH',
      headers,
      body: patchBody
    });
    if (!patchRes.ok) throw new Error('Не удалось сохранить Gist. HTTP ' + patchRes.status);

    setStatus('4/4 Проверяю результат и обновляю только локальный words...');

    const verifyRes = await fetch(`https://api.github.com/gists/${GIST_ID}`, { headers });
    if (!verifyRes.ok) throw new Error('Не удалось проверить Gist. HTTP ' + verifyRes.status);

    const verifyGist = await verifyRes.json();
    const verifyContent = JSON.parse(verifyGist.files['lexflow_data.json'].content);

    if (!Array.isArray(verifyContent.words) || verifyContent.words.length !== 313) {
      throw new Error('Проверка не пройдена: в Gist не 313 слов.');
    }

    localDb.words = RECOVERY_WORDS;
    if (localDb.github) localDb.github.gistId = GIST_ID;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(localDb));

    setStatus(
      'ГОТОВО ✅\n\nВ Gist: 313 слов.\nЛокально на этом устройстве: 313 слов.\nПлейлисты и остальные настройки не заменялись.\n\nТеперь можно вернуться в LexFlow.',
      'ok'
    );
  } catch (err) {
    console.error(err);
    setStatus('ОСТАНОВЛЕНО ❌\n\n' + err.message + '\n\nЕсли видишь эту ошибку — ничего дальше не нажимай и пришли мне этот текст.', 'err');
    btn.disabled = false;
  }
}

btn.addEventListener('click', restoreWords);
</script>
